name: Component Owners
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  assign:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'infra') }}
    runs-on: ubuntu-latest
    name: Request Owner Reviews
    steps:
      - uses: dyladan/component-owners@7ff2b343629407c4dbe1c28ae66f55f723543d2b # main @ 2026-01-22
        with:
          config-file: .github/component_owners.yml
          assign-owners: "false"
          request-owner-reviews: "true"
