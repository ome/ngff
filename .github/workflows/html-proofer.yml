name: "Build and Lint Site"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "specifications/**"
      - "rfc/**"
      - "resources/**"
      - "community/**"
      - "contributing/**"
      - "help-desk/**"
      - "_html_extra/**"
      - "_static/**"
      - "_ext/**"
      - "images/**"
      - "**/*.md"
      - "index.*"
      - "conf.py"
      - "requirements.txt"
      - "readthedocs.yml"

concurrency:
  group: build-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-html:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -r requirements.txt
          /tmp/venv/bin/pip install specifications/dev
          echo "/tmp/venv/bin" >> $GITHUB_PATH
      - name: Build the site
        run: sphinx-build -T -b html -d _build/doctrees -D language=en . _build/html
      - name: Build the PDF
        run: |
          sphinx-build -T -b latex -d _build/doctrees -D language=en . _build/latex
          cd _build/latex && latexmk -pdf -dvi- -ps- -jobname=ngff -interaction=nonstopmode
      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: _build/html
          retention-days: 1
  lint-html:
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          name: html
          path: _build/html
      - name: Install html-proofer
        run: gem install html-proofer
      - name: Validate all links, enforce alt text
        run: htmlproofer --ignore-files "/.*\/specifications\/(0\.[0-9]+|dev)\/.*/,/.*webpack-macros\.html/,/.*\/rfc\/4\/markdown\/.*/,/.*\/rfc\/5\/.*/,/.*\/rfc\/1\/.*/,/.*\/0\.[0-9]+(\.html|\/.*)/" --disable-external ./_build/html
      - name: Ensure no unexpected encoded HTML in output
        run: |
          ! fgrep -R 'lt;blockquote' _build/html
